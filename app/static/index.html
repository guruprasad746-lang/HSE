<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSE Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #dde1e8; --accent: #c2410c; --accent-soft: #fff1e8;
    --user: #1e3a5f; --user-text: #ffffff; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa3b2;
      --border: #2c323d; --accent: #fb923c; --accent-soft: #2a1d14;
      --user: #2b4a73; --user-text: #f1f5fb; --code: #232833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .thread { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); max-width: 80%; white-space: pre-wrap; }
  .bot { background: var(--panel); border: 1px solid var(--border); }
  .bot table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
  .bot code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .bot p:first-child { margin-top: 0; } .bot p:last-child { margin-bottom: 0; }
  .tools { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tools span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; }
  .error { color: #dc2626; }
  .welcome { color: var(--muted); text-align: center; margin-top: 8vh; }
  .welcome h2 { color: var(--text); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chips button { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 14px; }
  .chips button:hover { border-color: var(--accent); }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-height: 46px; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 18px; }
  .send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>HSE Assistant</h1>
  <div class="meta" id="meta">OSHA incident reports, 2015–2017</div>
  <button class="ghost" id="reset" type="button">New chat</button>
</header>
<main id="scroll">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <h2>Ask about workplace incidents</h2>
      <div>Answers come from the OSHA incident database, with incident ids you can check.</div>
      <div class="chips">
        <button type="button">What are the most common causes of fatal incidents?</button>
        <button type="button">Show recent ladder falls in residential construction</button>
        <button type="button">How have amputations trended by month?</button>
        <button type="button">What human factors show up most in electrocutions?</button>
      </div>
    </div>
  </div>
</main>
<form id="form">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask a safety question…" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
</form>
<script>
const thread = document.getElementById("thread");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let conversationId = crypto.randomUUID();
let busy = false;

const TOOL_LABELS = { search_incidents: "Searching incidents", incident_statistics: "Counting incidents", get_incident: "Reading report" };

fetch("/api/health").then(r => r.json()).then(d => {
  document.getElementById("meta").textContent = `${d.incidents.toLocaleString()} OSHA incident reports, 2015–2017`;
}).catch(() => {});

function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function render(md) {
  // Falls back to plain text if the markdown libraries couldn't load (e.g. CDN blocked).
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
  return `<div style="white-space:pre-wrap">${escapeHtml(md)}</div>`;
}
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

function addBubble(cls) {
  document.getElementById("welcome")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  thread.appendChild(el);
  return el;
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addBubble("user").textContent = text;
  const bot = addBubble("bot");
  const tools = document.createElement("div"); tools.className = "tools";
  const body = document.createElement("div"); body.innerHTML = "<em>Thinking…</em>";
  bot.append(tools, body);
  scrollDown();

  let answer = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "text") { answer += ev.text; body.innerHTML = render(answer); }
        else if (ev.type === "tool") {
          const chip = document.createElement("span");
          chip.textContent = TOOL_LABELS[ev.name] || ev.name;
          chip.title = JSON.stringify(ev.input);
          tools.appendChild(chip);
          if (!answer) body.innerHTML = "<em>Working…</em>";
        }
        else if (ev.type === "error") {
          const err = document.createElement("p"); err.className = "error"; err.textContent = ev.message;
          if (!answer) body.innerHTML = "";
          body.appendChild(err);
        }
        scrollDown();
      }
    }
    if (!answer && !body.querySelector(".error")) body.innerHTML = "<em>No answer returned.</em>";
  } catch (e) {
    body.innerHTML = ""; const err = document.createElement("p"); err.className = "error";
    err.textContent = "Couldn't reach the server: " + e.message; body.appendChild(err);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault(); const t = input.value; input.value = ""; input.style.height = ""; send(t);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });
document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => send(b.textContent)));
document.getElementById("reset").addEventListener("click", () => {
  fetch(`/api/conversations/${conversationId}`, { method: "DELETE" }).catch(() => {});
  conversationId = crypto.randomUUID();
  location.reload();
});
</script>
</body>
</html>
